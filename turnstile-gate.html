<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111713">
  <meta name="robots" content="noindex, nofollow">
  <title>Verify to continue - Orbit</title>
  <script>
    (() => {
      try {
        const settings = JSON.parse(localStorage.getItem('orbit-home-settings') || '{}');
        const root = document.documentElement;
        const themes = {
          orbit: '#111713',
          coral: '#171310',
          ice: '#10171b'
        };
        const theme = Object.prototype.hasOwnProperty.call(themes, settings.theme) ? settings.theme : 'orbit';
        root.dataset.theme = theme;

        if (typeof settings.accent === 'string' && /^#[0-9a-f]{6}$/i.test(settings.accent)) {
          root.style.setProperty('--accent', settings.accent);
        }
        document.querySelector('meta[name="theme-color"]').content = themes[theme];
      } catch {}
    })();
  </script>
  <style>
    :root {
      color-scheme: dark;
      --page-bg: #111713;
      --panel-bg: #19211c;
      --line: #344139;
      --text: #f2f4ed;
      --muted: #a0aca2;
      --accent: #c9f36b;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      background: var(--page-bg);
      color: var(--text);
    }
    :root[data-theme="coral"] { --page-bg: #171310; --panel-bg: #241d19; --line: #49382f; --accent: #ff926e; }
    :root[data-theme="ice"] { --page-bg: #10171b; --panel-bg: #192328; --line: #34464d; --accent: #7ce0db; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; background: var(--page-bg); }
    main { width: min(100%, 440px); padding: 32px; border: 1px solid var(--line); background: var(--panel-bg); }
    h1 { margin: 0 0 12px; font-size: clamp(25px, 6vw, 34px); }
    p { color: var(--muted); line-height: 1.6; }
    .widget { min-height: 65px; margin: 24px 0 16px; }
    button { min-height: 44px; padding: 0 18px; border: 0; background: var(--accent); color: #111713; font: inherit; font-weight: 800; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #message { min-height: 24px; color: #ffb29e; font-size: 14px; }
  </style>

<body>
  <main>
    <h1>One quick check</h1>
    <p>Complete the security check to continue to Orbit.</p>
    <form id="verification-form">
      <div class="widget">
        <div class="cf-turnstile" data-sitekey="0x4AAAAAAFZQzVqDPGfI-Uhu" data-action="website"></div>
      </div>
      <button id="continue-button" type="submit">Continue to Orbit</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const form = document.querySelector('#verification-form');
    const button = document.querySelector('#continue-button');
    const message = document.querySelector('#message');

    form.addEventListener('submit', async event => {
      event.preventDefault();
    
      const token = new FormData(form).get('cf-turnstile-response');
      if (typeof token !== 'string' || !token) {
        message.textContent = 'Complete the security check first.';
        return;
      }

      button.disabled = true;
      message.textContent = 'Verifying…';
      try {
        const response = await fetch('/api/turnstile/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token }),
          credentials: 'same-origin'
        });
        if (!response.ok) {
          let result = {};
          try {
            result = await response.json();
          } catch {}
          const messages = {
            turnstile_configuration_error: 'The Vercel TURNSTILE_SECRET is invalid. Check it matches this Turnstile widget’s secret, then redeploy.',
            turnstile_configuration_mismatch: 'The Turnstile widget action or allowed hostname does not match this site. Check the widget allows quantumstudios.vercel.app and uses the website action.',
            turnstile_challenge_rejected: 'Cloudflare rejected the challenge token. Refresh the check and try again; also confirm the Vercel secret belongs to the site key shown on this page.',
            turnstile_verification_failed: 'Turnstile rejected the challenge. Refresh the check and try again.'
          };
          throw new Error(messages[result.error] || `Verification failed (${response.status}). Please try again.`);
        }

        const requestedPath = new URLSearchParams(location.search).get('next') || '/';
        const destination = new URL(requestedPath, location.origin);
        if (destination.origin !== location.origin || destination.pathname === '/turnstile-gate.html') {
          destination.pathname = '/';
          destination.search = '';
          destination.hash = '';
        }
        location.replace(`${destination.pathname}${destination.search}${destination.hash}`);
      } catch (error) {
        message.textContent = error instanceof Error ? error.message : 'Verification failed. Please try again.';
        if (window.turnstile) window.turnstile.reset();
        button.disabled = false;
      }
    });
  </script>
</body>
